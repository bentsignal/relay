[package]
name = "relay-app"
description = "Relay's user interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
relay-proto = { workspace = true }
relay-ipc = { workspace = true }
relay-dsp = { workspace = true }
relay-update = { workspace = true }
gpui = { workspace = true }
crossbeam-channel = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Compile Metal shaders at runtime so building doesn't need Xcode's Metal toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["runtime_shaders"] }
