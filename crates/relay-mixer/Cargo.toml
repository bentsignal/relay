[package]
name = "relay-mixer"
description = "Relay's realtime mixing graph and clock bridges"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
relay-dsp = { workspace = true }
relay-proto = { workspace = true }
rtrb = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Media",
    "Win32_Security",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
